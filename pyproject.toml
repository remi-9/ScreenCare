[project]
name = "screencare"
version = "1.0.0"
description = "ScreenCare: a calm focus and wellness companion for the browser"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = [
    "httpx2",
    "pytest>=8.0",
    "pytailwindcss>=0.2",
    "ruff>=0.6",
    "uvicorn>=0.30",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["screencare"]

[tool.setuptools.package-data]
screencare = ["templates/*.html", "styles/*.css"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
