{# Focus and break color pickers, used in Settings and the header popover. #}
{% macro color_pickers() %}
    <template x-for="kind in ['focus', 'recover']" :key="kind">
      <fieldset class="mt-5">
        <legend class="mb-2 text-sm" x-text="kind === 'focus' ? 'Focus color' : 'Break color'"></legend>
        <div class="flex flex-wrap items-center gap-2.5">
          <template x-for="c in PALETTE[kind]" :key="c.hex">
            <button class="swatch" :style="{ background: c.hex }" :aria-pressed="prefs.colors[kind] === c.hex"
                    :aria-label="c.name" :title="c.name" @click="setColor(kind, c.hex)"></button>
          </template>
          <label class="swatch grid place-items-center has-[:focus-visible]:outline-2 has-[:focus-visible]:outline-offset-2"
                 :data-selected="isCustomColor(kind)" :title="'Custom ' + (kind === 'focus' ? 'focus' : 'break') + ' color'"
                 :style="isCustomColor(kind) ? { background: prefs.colors[kind] } : { background: 'conic-gradient(from 90deg, #f87171, #fbbf24, #4ade80, #38bdf8, #a78bfa, #f472b6, #f87171)' }">
            <input type="color" class="sr-only" :value="prefs.colors[kind]" @input="setColor(kind, $event.target.value)"
                   :aria-label="'Custom ' + (kind === 'focus' ? 'focus' : 'break') + ' color'">
            <span x-show="!isCustomColor(kind)" class="size-3.5 rounded-full bg-white/90 shadow" aria-hidden="true"></span>
          </label>
        </div>
      </fieldset>
    </template>
    <button class="mt-3 text-sm text-stone-600 underline-offset-4 hover:underline dark:text-stone-400" @click="resetColors()"
            x-show="!isDefaultColors">Reset colors</button>
{% endmacro %}
